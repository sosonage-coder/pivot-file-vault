name: Conflict Marker Check

on:
  pull_request:
  push:
    branches: [main, work]

jobs:
  conflict-marker-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fail on conflict markers
        run: |
          if git grep -n -I -E '^(<<<<<<<|=======|>>>>>>>)' -- . ':!.github/workflows/conflict-marker-check.yml'; then
          if git grep -n -E '^<{7} |^={7}$|^>{7} ' -- . ':!.github/workflows/*'; then
            echo "Conflict markers detected. Please resolve before merging."
            exit 1
          fi
